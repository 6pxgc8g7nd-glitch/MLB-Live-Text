name: CI

# 每次推送／PR 都跑測試；推到 main 且測試全過，才部署到 GitHub Pages（Pages 來源需設為「GitHub Actions」）
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 比對 VERSION 需要前一個提交

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 安裝開發工具（ESLint）
        run: npm ci

      - name: ESLint
        run: npx eslint .

      - name: 單元測試
        run: node tests/unit.test.js

      - name: 檢查 sw.js（快取清單與版本號）
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/sw.mjs check "$BASE"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 安裝 Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: 截圖檢查（模擬 API，不連 MLB）
        run: python tests/shots.py shots

      - name: 上傳截圖
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: shots
          retention-days: 7

  deploy:
    needs: test # 測試沒過就不會執行
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: 只收網站需要的檔案（不含測試、腳本、node_modules）
        run: |
          mkdir _site
          cp -R index.html replay.html style.css sw.js manifest.webmanifest js icons logos _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
