<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MLB 文字轉播</title>
  <meta name="theme-color" content="#004B93">
  <meta name="description" content="MLB 比分、逐打席文字轉播與排名（個人使用）">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MLB 轉播">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <button id="back" aria-label="返回" hidden>‹</button>
    <h1 id="title">MLB 比分</h1>
    <span id="updated" class="upd"></span>
    <button id="langBtn" aria-label="切換中英文" hidden>中</button>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="view"><div class="loading">載入中…</div></main>
  <nav class="tabbar">
    <a href="#/scores" data-tab="scores">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M9 10v9"/></svg>比分
    </a>
    <a href="#/standings" data-tab="standings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>排名
    </a>
  </nav>
  <noscript><p style="padding:16px">需要啟用 JavaScript 才能使用。</p></noscript>
  <script src="app.js" defer></script>

</html>
