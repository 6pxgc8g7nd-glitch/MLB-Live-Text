<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MLB Live Text</title>
  <meta name="theme-color" content="#004B93">
  <meta name="description" content="MLB 比分、逐打席文字轉播與排名（個人使用）">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MLB Live">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg style="display:none" aria-hidden="true"><symbol id="ball" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#fff"/><path d="M6 5c3 3 3 11 0 14M18 5c-3 3-3 11 0 14" fill="none" stroke="#A6051A" stroke-width="1.6" stroke-linecap="round"/></symbol></svg>
  <header class="top"><div class="top-in">
    <div class="r1">
      <img id="ballIc" class="bb" src="logos/mlb-on-dark.svg" alt="MLB">
      <h1 id="title">MLB Live Text</h1>
      <span id="updated" class="upd"></span>
      <button id="langBtn" class="btn" aria-label="切換中英文" hidden></button>
    </div>
    <div class="r2" id="infoRow">
      <button id="segL" class="dseg"><small></small><b></b></button>
      <button id="segC" class="dseg on" aria-label="點一下回到今天，長按選擇日期"><small></small><b></b></button>
      <button id="segR" class="dseg"><small></small><b></b></button>
      <input id="datePick" type="date" tabindex="-1" aria-hidden="true">
    </div>
    <div class="r3" id="gameRow" hidden></div>
  </div></header>
  <div id="banner" class="banner" hidden></div>
  <main id="view"><div class="loading">載入中…</div></main>
  <nav class="tabbar"><div class="tb-in">
    <a href="#/scores" data-tab="scores">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M6.5 4.8c2.4 2.2 2.4 12.2 0 14.4M17.5 4.8c-2.4 2.2-2.4 12.2 0 14.4"/></svg>比分
    </a>
    <a href="#/standings" data-tab="standings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="11.5" width="4.5" height="8" rx="1.5"/><rect x="9.8" y="4.5" width="4.5" height="15" rx="1.5"/><rect x="16" y="14.5" width="4.5" height="5" rx="1.5"/></svg>排名
    </a>
    <a href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.03 10.46 L21.43 10.88 L21.43 13.12 L19.03 13.54 L18.06 15.88 L19.46 17.88 L17.88 19.46 L15.88 18.06 L13.54 19.03 L13.12 21.43 L10.88 21.43 L10.46 19.03 L8.12 18.06 L6.12 19.46 L4.54 17.88 L5.94 15.88 L4.97 13.54 L2.57 13.12 L2.57 10.88 L4.97 10.46 L5.94 8.12 L4.54 6.12 L6.12 4.54 L8.12 5.94 L10.46 4.97 L10.88 2.57 L13.12 2.57 L13.54 4.97 L15.88 5.94 L17.88 4.54 L19.46 6.12 L18.06 8.12Z"/><circle cx="12" cy="12" r="3"/></svg>設定
    </a>
  </div></nav>
  <noscript><p style="padding:16px">需要啟用 JavaScript 才能使用。</p></noscript>
  <script src="mock.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
